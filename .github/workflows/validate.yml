name: Validate skill

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  eval-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run full test suite
        run: bash scripts/run_tests.sh
      - name: Check JSON syntax
        run: |
          for catalog in design-system/*.json styles/*.json evals/*.json; do
            python -m json.tool "$catalog" >/dev/null
          done