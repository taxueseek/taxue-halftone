<svg xmlns="http://www.w3.org/2000/svg" width="380" height="240" viewBox="0 0 380 240"><rect x="24" y="60" width="332" height="120" fill="#FFFFFF" stroke="#999" stroke-width="1"/><rect x="24" y="60" width="90" height="120" fill="#1E3A64" opacity="0.85"/><text x="69.0" y="200" font-size="11" fill="#333" text-anchor="middle">#1E3A64</text><rect x="120" y="60" width="90" height="120" fill="#2148B8" opacity="0.85"/><text x="165.0" y="200" font-size="11" fill="#333" text-anchor="middle">#2148B8</text><text x="24" y="28" font-size="15" font-weight="bold" fill="#222">物影蓝晒风格（蓝染变体）</text><text x="24" y="44" font-size="11" fill="#666">mech=photogram_stencil · behavior=still · volume=image_lead</text><text x="24" y="230" font-size="11" fill="#444">整张纸经蓝晒曝光，除物件遮挡处呈白色外全为染斑均匀的靛蓝；一件现代潮流物件（滑板/耳机/球鞋/自行车零件等）直接平放在感光纸上，留下白色物影</text></svg>